name: ntfs-3g Windows Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, windows-2019]
        compiler: [gcc]
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2

      - name: Set up MSYS2 and install dependencies on Windows
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: |
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-crt-git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-gdb-multiarch
            mingw-w64-x86_64-headers-git
            mingw-w64-x86_64-libmangle-git
            mingw-w64-x86_64-libwinpthread-git
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-tools-git
            mingw-w64-x86_64-winpthreads-git
            mingw-w64-x86_64-winstorecompat-git
            mingw-w64-x86_64-libgcrypt

      - name: Run autogen, configure and build on Windows (MSYS2)
        shell: msys2 {0}
        env:
          CC: ${{ matrix.compiler }}
        run: |
          ./autogen.sh || echo "Non-critical error during autogen.sh"
          ./configure
          make
